<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <title>Donor Registration - BloodConnect</title>
  <link rel="icon" href="assets/bloodconnect-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="donor_registration.css?v=20260827c" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-client.js?v=20260922authflow"></script>
</head>
<body>
  <div class="glass-rect-layer" aria-hidden="true">
    <span class="glass-rect glass-rect-left-wide"></span>
    <span class="glass-rect glass-rect-left-slim"></span>
    <span class="glass-rect glass-rect-right-wide"></span>
    <span class="glass-rect glass-rect-right-slim"></span>
  </div>

  <main class="page-wrap">
    <section class="form-shell" aria-labelledby="formTitle">
      <a href="index.html" class="back-link" aria-label="Back to home">
        <i class="fa-solid fa-arrow-left-long"></i>
        <span id="backLinkText">Back to Home</span>
      </a>

      <h1 id="formTitle">Blood Donor Registration</h1>
      <p class="intro">Fill in your basic details to begin your donor screening process.</p>
      <div class="account-link-notice" id="accountLinkNotice" role="status" aria-live="polite">
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        <span>Checking your account...</span>
      </div>

      <form id="donorForm" class="donor-form" novalidate>
        <div class="grid-three">
          <div class="field-group">
            <label for="firstName"><i class="fa-solid fa-user"></i> First Name</label>
            <input id="firstName" name="firstName" type="text" placeholder="Jose" required />
          </div>
          <div class="field-group">
            <label for="middleName"><i class="fa-solid fa-user"></i> Middle Name</label>
            <input id="middleName" name="middleName" type="text" autocomplete="additional-name" placeholder="Protasio" />
          </div>
          <div class="field-group">
            <label for="lastName"><i class="fa-solid fa-user-tag"></i> Last Name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Rixal" required />
          </div>
        </div>

        <div class="grid-two">
          <div class="field-group">
            <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="example@mail.com" required />
          </div>
          <div class="field-group">
            <label for="bloodType"><i class="fa-solid fa-droplet"></i> Blood Type</label>
            <div class="custom-select-wrapper">
              <select id="bloodType" name="bloodType" required>
                <option value="">Select blood type</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid-two">
          <div class="field-group">
            <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric"
              pattern="09[0-9]{9}" placeholder="09xxxxxxxxx"
              aria-describedby="phoneFeedback" required />
            <small class="field-feedback" id="phoneFeedback" aria-live="polite">
              Enter an 11-digit Philippine mobile number starting with 09.
            </small>
          </div>
          <div class="field-group">
            <label for="gender"><i class="fa-solid fa-venus-mars"></i> Gender</label>
            <div class="custom-select-wrapper">
              <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Non-binary">Non-binary</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid-two">
          <div class="field-group">
            <label for="dob"><i class="fa-solid fa-calendar-days"></i> Birthday</label>
            <input id="dob" name="dob" type="date" min="1900-01-01" required />
          </div>
          <div class="field-group">
            <label for="address"><i class="fa-solid fa-location-dot"></i> Home Address</label>
            <input id="address" name="address" type="text" placeholder="Street, Barangay, City, Province" required />
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>

      <div id="messageBox" class="message-box" aria-live="polite"></div>
    </section>
  </main>

  <!-- Success Modal -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-content">
      <div class="modal-icon">
        <i class="fa-solid fa-check"></i>
      </div>
      <h2 class="modal-title">Thank You for Registering!</h2>
      <div class="modal-body-text" id="modalText">
        <!-- Text injected by JS -->
      </div>
      <button type="button" class="modal-ok-btn" id="modalOkBtn">Okay</button>
    </div>
  </div>

  <script src="/scripts/pages/donor-registration.js?v=20260915bloodconnect"></script>
  <script src="/pull-to-refresh.js?v=20260824a" defer></script>
</body>
</html>
