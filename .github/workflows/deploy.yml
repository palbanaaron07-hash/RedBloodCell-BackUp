name: Build and Deploy via FTP

on:
  push:
    branches:
      - main
      - deploy-test
  workflow_dispatch:

# Overlapping uploads to the same FTP account leave stale .in.* temp files
# behind, so only one deploy may run at a time.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Server Config and Entry Points
        run: |
          if [ -f ".htaccess" ]; then
            cp .htaccess dist/
          fi
          if [ -f "default.php" ]; then
            cp default.php dist/
          fi
          if [ -f "index.php" ]; then
            cp index.php dist/
          fi

      - name: Validate FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              exit 1
            fi
          done

          echo "Deploying to FTP directory: $FTP_SERVER_DIR"

      - name: Test FTP connection and credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          case "$FTP_SERVER" in
            ftp://*|ftps://*)
              FTP_URL="$FTP_SERVER"
              ;;
            http://*)
              FTP_URL="ftp://${FTP_SERVER#http://}"
              ;;
            https://*)
              FTP_URL="ftp://${FTP_SERVER#https://}"
              ;;
            *)
              FTP_URL="ftp://$FTP_SERVER"
              ;;
          esac

          set +e
          curl --silent --show-error --fail --connect-timeout 30 --max-time 60 --retry 4 --retry-delay 10 --retry-connrefused --ftp-pasv --list-only --output /dev/null --user "$FTP_USERNAME:$FTP_PASSWORD" "$FTP_URL/$FTP_SERVER_DIR/"
          status=$?
          set -e

          case "$status" in
            0)
              echo "FTP connection and authentication succeeded."
              echo "Remote directory $FTP_SERVER_DIR is accessible."
              ;;
            6)
              echo "::error::FTP hostname could not be resolved. Check FTP_SERVER."
              exit "$status"
              ;;
            7)
              echo "::error::FTP server refused the connection. Check the host, protocol, and port."
              exit "$status"
              ;;
            28)
              echo "::error::FTP connection still timed out after retries. The server is unavailable or blocks this GitHub-hosted runner."
              exit "$status"
              ;;
            9)
              echo "::error::FTP login succeeded, but $FTP_SERVER_DIR is not accessible from this account. Set the FTP_SERVER_DIR secret to the directory shown after login in FileZilla."
              exit "$status"
              ;;
            67)
              echo "::error::FTP authentication failed. Check FTP_USERNAME and FTP_PASSWORD."
              exit "$status"
              ;;
            *)
              echo "::error::FTP connection test failed with curl exit code $status."
              exit "$status"
              ;;
          esac

      - name: Deploy website
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          case "$FTP_SERVER" in
            ftp://*|ftps://*)
              FTP_URL="$FTP_SERVER"
              ;;
            http://*)
              FTP_URL="ftp://${FTP_SERVER#http://}"
              ;;
            https://*)
              FTP_URL="ftp://${FTP_SERVER#https://}"
              ;;
            *)
              FTP_URL="ftp://$FTP_SERVER"
              ;;
          esac

          sudo apt-get install -y lftp > /dev/null 2>&1

          # Pure-FTPd uploads into hidden ".in.<name>." files and refuses to
          # overwrite one left behind by an interrupted upload. Remove any
          # stale temp file for every path we are about to upload.
          cleanup_script="$RUNNER_TEMP/ftp-cleanup.lftp"
          remote_root="${FTP_SERVER_DIR%/}"
          : > "$cleanup_script"
          (cd dist && find . -type f) | while IFS= read -r path; do
            path="${path#./}"
            dir=$(dirname "$path")
            base=$(basename "$path")
            if [ "$dir" = "." ]; then
              stale=".in.$base."
            else
              stale="$dir/.in.$base."
            fi
            printf 'rm -f "%s/%s"\n' "$remote_root" "$stale" >> "$cleanup_script"
          done

          echo "=== Removing stale upload temp files ==="
          lftp -c "
            set net:max-retries 5;
            set net:timeout 30;
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_URL\";
            source \"$cleanup_script\";
            bye
          " || true

          echo "=== Deploying to $FTP_SERVER_DIR ==="
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 5;
            set net:timeout 30;
            set ssl:check-hostname no;
            set ssl:verify-certificate no;
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_URL\";
            pwd;
            mirror --reverse --delete --verbose --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob public_html/ --exclude-glob public_html --exclude-glob '.in.*' --exclude-glob .user.ini ./dist/ \"$FTP_SERVER_DIR/\";
            bye
          "

          echo "=== Done ==="
