name: Build and Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Upload to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Server Config and Entry Points
        run: |
          if [ -f ".htaccess" ]; then
            cp .htaccess dist/
          fi
          if [ -f "default.php" ]; then
            cp default.php dist/
          fi
          if [ -f "index.php" ]; then
            cp index.php dist/
          fi

      - name: Validate FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              exit 1
            fi
          done

      - name: Test FTP connection and credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          curl --silent --show-error --fail --connect-timeout 30 --max-time 60 --retry 4 --retry-delay 10 --retry-connrefused --ftp-pasv --list-only --output /dev/null --user "$FTP_USERNAME:$FTP_PASSWORD" "$FTP_SERVER/public_html/"
          status=$?
          set -e

          case "$status" in
            0)
              echo "FTP connection and authentication succeeded."
              echo "Remote directory /public_html/ is accessible."
              ;;
            6)
              echo "::error::FTP hostname could not be resolved. Check FTP_SERVER."
              exit "$status"
              ;;
            7)
              echo "::error::FTP server refused the connection. Check the host, protocol, and port."
              exit "$status"
              ;;
            28)
              echo "::error::FTP connection still timed out after retries. The server is unavailable or blocks this GitHub-hosted runner."
              exit "$status"
              ;;
            9)
              echo "::error::FTP login succeeded, but /public_html/ is not accessible from this account. Check the remote directory shown in FileZilla."
              exit "$status"
              ;;
            67)
              echo "::error::FTP authentication failed. Check FTP_USERNAME and FTP_PASSWORD."
              exit "$status"
              ;;
            *)
              echo "::error::FTP connection test failed with curl exit code $status."
              exit "$status"
              ;;
          esac

      - name: Deploy to public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          echo "=== Deploying to /public_html/ ==="
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 5;
            set net:timeout 30;
            set ssl:check-hostname no;
            set ssl:verify-certificate no;
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            pwd;
            mirror --reverse --delete --verbose ./dist/ /public_html/;
            bye
          "

          echo "=== Done ==="
