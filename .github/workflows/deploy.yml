name: Build and Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Upload to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Server Config and Entry Points
        run: |
          if [ -f ".htaccess" ]; then
            cp .htaccess dist/
          fi
          if [ -f "default.php" ]; then
            cp default.php dist/
          fi
          if [ -f "index.php" ]; then
            cp index.php dist/
          fi

      - name: Validate FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              exit 1
            fi
          done

      - name: Deploy to public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          echo "=== Deploying to /public_html/ ==="
          lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ssl:verify-certificate false;
            set ftp:ssl-allow yes;
            mirror --reverse --delete --verbose ./dist/ /public_html/;
            bye
          " -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER"

          echo "=== Done ==="
